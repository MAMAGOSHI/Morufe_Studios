<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Morufe Studios is a Johannesburg brand and design studio creating purposeful identities, campaigns and visual experiences."
  >

  <title>Morufe Studios | Brand & Design</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&family=Raleway:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>


<body class="home-page">


  <!-- =========================
       HEADER
  ========================== -->

  <header class="site-header">

    <a
      class="brand brand-light"
      href="index.html"
      aria-label="Morufe Studios home"
    >
      morufe<span class="brand-ring" aria-hidden="true"></span>
    </a>


    <nav class="main-nav" aria-label="Main navigation">

      <a class="active" href="index.html">
        Home
      </a>

      <a href="about.html">
        About
      </a>

      <a href="work.html">
        Work
      </a>

      <a href="contact.html">
        Contact
      </a>

    </nav>

  </header>



  <!-- =========================
       HOMEPAGE
  ========================== -->

  <main class="home-hero">


    <!--
      HERO IMAGE

      Put your final homepage image inside:

      assets/hero-image.jpg

      The image will automatically fill the screen.
    -->

    <div
      class="hero-media"
      aria-hidden="true"
    >

      <div class="hero-overlay"></div>

    </div>



    <!--
      OPTIONAL VIDEO

      If you eventually want a video instead,
      remove the hero-media div above and use this:

      <video
        class="hero-video"
        autoplay
        muted
        loop
        playsinline
        poster="assets/hero-poster.jpg"
      >
        <source
          src="assets/hero-video.mp4"
          type="video/mp4"
        >
      </video>

    -->



    <!-- =========================
         HERO CONTENT
    ========================== -->

    <div class="home-content">

      <p class="eyebrow">
        Brand &amp; Design Studio · Johannesburg
      </p>


      <h1>
        Design carries what
        <br>
        came before it<span>.</span>
      </h1>


      <a
        class="home-enter"
        href="about.html"
      >

        <span>
          Discover Morufe
        </span>

        <span class="arrow">
          ↗
        </span>

      </a>

    </div>



    <!-- =========================
         HOMEPAGE FOOTER
    ========================== -->

    <div class="home-footer">

      <span>
        Morufe Studios
      </span>

      <span>
        Johannesburg · South Africa
      </span>

    </div>


  </main>



  <!-- JAVASCRIPT -->

  <script src="script.js"></script>

</body>

</html>
